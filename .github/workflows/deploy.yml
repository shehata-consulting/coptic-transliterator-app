name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      # Workflow edits don't change the built app: a CI-only commit used to
      # rebuild and redeploy all four apps for nothing. Covers deploy.yml
      # itself too — fire a deploy deliberately with workflow_dispatch.
      - '.github/**'
      - '.claude/**'
      - 'CLAUDE.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npx expo export --platform web
      - name: Write service account credentials
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SECRET" > "$RUNNER_TEMP/sa.json"
      - run: npx firebase-tools deploy --only hosting --project coptic-transliterator-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
