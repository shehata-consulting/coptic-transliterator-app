name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be re-fired for a commit whose push webhook was dropped —
  # a GitHub Actions incident silently created no runs at all, twice, and
  # without this there is no way to get CI onto that SHA short of an empty
  # commit. Changes nothing about a normal push.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
